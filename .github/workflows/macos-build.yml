name: macOS build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: StudySprint
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Build core library
        run: |
          set -o pipefail
          swift build --target StudySprintCore 2>&1 | grep -vE '^\[[0-9]+/[0-9]+\]'

      - name: Unit tests
        run: |
          set -o pipefail
          swift test --filter StudySprintCoreTests 2>&1 | grep -vE '^\[[0-9]+/[0-9]+\] (Compiling|Write|Emitting)'

      - name: Build app (release)
        if: always()
        run: |
          set -o pipefail
          swift build -c release 2>&1 | grep -vE '^\[[0-9]+/[0-9]+\]'

      - name: Package .app
        run: |
          ./build-app.sh
          cd build && ditto -c -k --keepParent StudySprint.app StudySprint.zip

      - uses: actions/upload-artifact@v4
        with:
          name: StudySprint-app
          path: StudySprint/build/StudySprint.zip

  # Free mode end to end: real Ollama + a small open model + live YouTube search.
  free-mode:
    needs: build
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: StudySprint
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install and start Ollama
        run: |
          brew install ollama
          (ollama serve > /tmp/ollama.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:11434/api/version && break; sleep 2; done
          ollama pull gemma3:1b
      - name: Build a guide, quiz, grade and tutor with the free engine
        run: swift run -c release free-mode-smoke gemma3:1b
      - name: Ollama log
        if: always()
        run: tail -40 /tmp/ollama.log || true

  # Add "[screenshots]" to a commit message to refresh docs/screenshots from the real app.
  screenshots:
    needs: build
    if: contains(github.event.head_commit.message, '[screenshots]')
    runs-on: macos-15
    permissions:
      contents: write
    defaults:
      run:
        working-directory: StudySprint
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: ./build-app.sh
      - name: Capture screens
        run: Scripts/screenshots.sh ../docs/screenshots
      - name: Commit screenshots
        run: |
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Update app screenshots [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
