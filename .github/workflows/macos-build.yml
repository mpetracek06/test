name: macOS build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: StudySprint
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Build core library
        run: |
          set -o pipefail
          swift build --target StudySprintCore 2>&1 | grep -vE '^\[[0-9]+/[0-9]+\]'

      - name: Unit tests
        run: |
          set -o pipefail
          swift test --filter StudySprintCoreTests 2>&1 | grep -vE '^\[[0-9]+/[0-9]+\] (Compiling|Write|Emitting)'

      - name: Build app (release)
        if: always()
        run: |
          set -o pipefail
          swift build -c release 2>&1 | grep -vE '^\[[0-9]+/[0-9]+\]'

      - name: Package .app
        run: |
          ./build-app.sh
          cd build && ditto -c -k --keepParent StudySprint.app StudySprint.zip

      - uses: actions/upload-artifact@v4
        with:
          name: StudySprint-app
          path: StudySprint/build/StudySprint.zip
